; PHP settings for MediaWiki, on top of the image's defaults. The ${...} values
; come from the environment, with defaults in the Containerfile.

expose_php = Off
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 300

; Matches client_max_body_size in nginx on the host.
upload_max_filesize = 100M
post_max_size = 100M

; The code never changes inside a running container.
opcache.enable = 1
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Object cache ($wgMainCacheType = CACHE_ACCEL). Small: parsed pages and
; sessions are kept in the database, so it only holds small objects.
apc.shm_size = ${PHP_APCU_SIZE}
