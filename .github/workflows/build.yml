name: Build

on:
  push:
    branches: [main]
  # Weekly, for fixes to the PHP image.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/catram/mediawiki

jobs:
  build:
    # GitHub's Ubuntu image comes with Podman.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned MediaWiki version
        id: mw
        run: |
          version=$(sed -n 's/^ARG MW_VERSION=//p' Containerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "series=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "tag=$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.mw.outputs.version }}
          SERIES: ${{ steps.mw.outputs.series }}
          TAG: ${{ steps.mw.outputs.tag }}
        run: |
          podman build --pull=always \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:$SERIES" \
            .

      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIES: ${{ steps.mw.outputs.series }}
          TAG: ${{ steps.mw.outputs.tag }}
        run: |
          printf '%s' "$TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman push "$IMAGE:$TAG"
          podman push "$IMAGE:$SERIES"
          podman logout ghcr.io
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
